name: lifepilot
description: LifePilot local-first personal assistant MVP skeleton.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: '>=3.3.2 <3.4.0'
  go_router: '>=17.5.0 <18.0.0'
  drift: '>=2.35.1 <2.36.0'
  drift_flutter: ^0.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: '>=2.35.1 <2.36.0'
  build_runner: ^2.10.0

flutter:
  uses-material-design: true
